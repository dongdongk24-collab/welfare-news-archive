name: Daily welfare news archive update

on:
  schedule:
    # 08:00 Asia/Seoul = 23:00 UTC on the previous day
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional single date in YYYY-MM-DD. Leave empty to collect all missing dates through yesterday KST."
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-welfare-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine target dates
        id: dates
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          kst = timezone(timedelta(hours=9))
          explicit = (os.environ.get("TARGET_DATE") or "").strip()
          end = datetime.now(kst).date() - timedelta(days=1)

          if explicit:
              dates = [explicit]
          else:
              existing = set()
              for path in Path("data").glob("news-*.json"):
                  match = re.fullmatch(r"news-(\d{4}-\d{2}-\d{2})\.json", path.name)
                  if match:
                      try:
                          existing.add(datetime.strptime(match.group(1), "%Y-%m-%d").date())
                      except ValueError:
                          pass

              if existing:
                  start = min(existing)
                  dates = []
                  current = start
                  while current <= end:
                      if current not in existing:
                          dates.append(current.isoformat())
                      current += timedelta(days=1)
              else:
                  dates = [end.isoformat()]

          value = " ".join(dates)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"dates={value}\n")
              output.write(f"count={len(dates)}\n")
          print(f"Target dates: {value or 'none'}")
          PY

      - name: Update welfare news archive from RSS feeds
        env:
          TARGET_DATES: ${{ steps.dates.outputs.dates }}
        run: |
          if [ -z "$TARGET_DATES" ]; then
            echo "No missing welfare news dates."
            exit 0
          fi
          for target_date in $TARGET_DATES; do
            echo "Updating welfare news for $target_date"
            TARGET_DATE="$target_date" python scripts/update_welfare_news.py
          done

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No welfare news updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts data assets/app.js
          git commit -m "Update welfare news archive from RSS"
          git push
